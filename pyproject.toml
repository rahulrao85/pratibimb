[project]
name = "pratibimb"
version = "0.1.0"
description = "Pratibimb: The AI mirror of a senior decision-maker for Google Cloud AI Builder Cup 2026"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "google-adk>=2.11.0",
    "google-genai>=2.28.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "app"]
